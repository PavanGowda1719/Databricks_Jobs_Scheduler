services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: databricks-scheduler-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABRICKS_HOST=${DATABRICKS_HOST:-https://dbc-48d26f7e-6eda.cloud.databricks.com}
      - DATABRICKS_TOKEN=${DATABRICKS_TOKEN}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    volumes:
      - ./backend/data:/app/data
    networks:
      - pipeline-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: databricks-scheduler-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pipeline-net

networks:
  pipeline-net:
    driver: bridge

