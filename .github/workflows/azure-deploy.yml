name: Deploy to Azure App Service (Docker)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: ${{ secrets.ACR_NAME }} # e.g. myacr.azurecr.io
  AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }} # e.g. databricks-pipeline-dashboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and Push Backend Container
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/scheduler-backend:${{ github.sha }} -t ${{ secrets.ACR_NAME }}.azurecr.io/scheduler-backend:latest ./backend
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/scheduler-backend:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/scheduler-backend:latest

      - name: Build and Push Frontend Container
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/scheduler-frontend:${{ github.sha }} -t ${{ secrets.ACR_NAME }}.azurecr.io/scheduler-frontend:latest ./frontend
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/scheduler-frontend:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/scheduler-frontend:latest

      - name: Deploy to Azure Web App for Containers
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: '${{ secrets.ACR_NAME }}.azurecr.io/scheduler-backend:latest'

